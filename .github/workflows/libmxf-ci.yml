name: CI Test

on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-go:
    runs-on: ubuntu-latest
    container:
      image: luthersystems/build-go:v0.1.41
      # build-go v0.1.x runs as a non-root user, which cannot write the
      # runner's file-command files that actions/checkout needs.
      options: --user root
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        lfs: true
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Run CI tests
      run: make go-citest
  test-js:
    runs-on: ubuntu-latest
    container:
      image: luthersystems/build-js:v0.1.41
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        lfs: true
    - name: Run CI tests
      run: make js-citest
