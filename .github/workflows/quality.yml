name: Quality

# The org's shared code quality checks: the work marker gate, golangci-lint
# (one pinned version, with this repo's .golangci.yml) and the API break gate,
# from luthersystems/.github. Every repo runs the same checks and versions,
# and an org ruleset will require its one check, "quality / result". How to
# make an exception: docs/quality-workflow.md in luthersystems/.github.

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id must stay "quality": the ruleset requires "quality / result".
  quality:
    permissions:
      contents: read
      issues: read # the work marker gate reads each named issue's state
    uses: luthersystems/.github/.github/workflows/quality.yml@v1
    with:
      # libmxf is a library: other modules import its decoders (MxfDecode,
      # decode.Decode), so a removed or changed exported symbol breaks them.
      # scripts/modzipcheck is left out: it is only a main package, and the
      # gate refuses a module with no public package.
      api-break: true
      api-break-directories: .
      # libmxf imports substrate, which imports license; both are private.
      goprivate: github.com/luthersystems/substrate,github.com/luthersystems/license
    secrets:
      # One read-only deploy key for substrate and one for license, the same
      # secret the CI and security workflows use.
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
